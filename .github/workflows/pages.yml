# Construiește aplicația de telefon (app + motor + modele) și o publică pe ramura gh-pages.
# Fișierele > 90 MB sunt tăiate în bucăți (limita GitHub e 100 MB/fișier);
# service worker-ul le lipește la loc pe telefon.
name: Deploy VicCount (telefon)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Aplicația
        run: |
          mkdir -p site
          cp -r phone/* site/
          touch site/.nojekyll

      - name: transformers.js + ONNX Runtime (local, fără CDN)
        run: |
          npm pack @huggingface/transformers@3.8.1
          tar xzf huggingface-transformers-3.8.1.tgz
          mkdir -p site/vendor
          cp package/dist/transformers.min.js package/dist/ort-wasm-simd-threaded.jsep.mjs package/dist/ort-wasm-simd-threaded.jsep.wasm site/vendor/

      - name: Modele (Grounding DINO tiny + DINOv2-reg small, int8)
        run: |
          pip install -q "huggingface_hub>=0.24"
          python - <<'EOF'
          from huggingface_hub import snapshot_download
          for repo, name in [("onnx-community/grounding-dino-tiny-ONNX", "grounding-dino-tiny"),
                             ("onnx-community/dinov2-with-registers-small", "dinov2-reg-small")]:
              snapshot_download(repo, local_dir=f"site/models/{name}",
                                allow_patterns=["*.json", "onnx/model_quantized.onnx"])
          EOF
          rm -rf site/models/*/.cache

      - name: Taie fișierele mari în bucăți
        run: |
          python - <<'EOF'
          import json, os
          LIM = 90 * 1024 * 1024
          for root, _, files in os.walk("site"):
              for f in files:
                  p = os.path.join(root, f)
                  size = os.path.getsize(p)
                  if size <= LIM:
                      continue
                  n = 0
                  with open(p, "rb") as src:
                      while chunk := src.read(LIM):
                          with open(f"{p}.part{n}", "wb") as out:
                              out.write(chunk)
                          n += 1
                  json.dump({"parts": n, "size": size}, open(p + ".parts.json", "w"))
                  os.remove(p)
                  print(f"{p}: {size} B -> {n} bucăți")
          EOF
          du -sh site; find site -size +50M

      - name: Publică pe gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true
