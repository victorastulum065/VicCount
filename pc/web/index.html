<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0f12">
<title>VicCount</title>
<style>
:root{
  --bg:#0d0f12;--panel:#161a20;--line:#262c35;--txt:#e8ebef;--mut:#8b95a3;
  --acc:#2ee6a6;--acc2:#ffb020;--bad:#ff5d5d;--r:12px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line)}
header b{font-size:17px;letter-spacing:.3px}header b span{color:var(--acc)}
#status{font-size:12px;color:var(--mut)}
main{max-width:1100px;margin:0 auto;padding:16px;display:grid;gap:16px;grid-template-columns:1fr 300px}
@media(max-width:820px){main{grid-template-columns:1fr}}
#stage{position:relative;background:var(--panel);border:1px dashed var(--line);border-radius:var(--r);min-height:320px;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none}
#stage.has{border-style:solid}
#drop{text-align:center;color:var(--mut);padding:24px}
#drop .big{font-size:42px;margin-bottom:6px}
canvas{max-width:100%;display:none;cursor:crosshair}
#stage.has canvas{display:block}#stage.has #drop{display:none}
#busy{position:absolute;inset:0;background:#0d0f12cc;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;font-size:14px}
#busy.on{display:flex}
.spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:s 0.8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
aside{display:flex;flex-direction:column;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
#count{font-size:64px;font-weight:700;line-height:1;color:var(--acc);font-variant-numeric:tabular-nums}
#meta{font-size:12px;color:var(--mut);margin-top:6px;min-height:16px}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:6px}
input[type=text]{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--txt);padding:10px;font-size:15px}
input[type=range]{width:100%;accent-color:var(--acc)}
.row{display:flex;gap:8px;flex-wrap:wrap}
button{flex:1;min-height:42px;border:1px solid var(--line);background:#1d222a;color:var(--txt);border-radius:8px;font-size:14px;cursor:pointer;padding:0 12px}
button.pri{background:var(--acc);color:#04130d;border-color:var(--acc);font-weight:700}
button:disabled{opacity:.45;cursor:default}
.hint{font-size:12px;color:var(--mut);line-height:1.45}
.hint b{color:var(--txt)}
.tog{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut)}
.err{color:var(--bad)}
</style>
</head>
<body>
<header><b>Vic<span>Count</span></b><div id="status">conectare…</div></header>
<main>
  <div>
    <div id="stage">
      <div id="drop"><div class="big">📷</div>Apasă pentru poză / cameră<br><span class="hint">sau trage o imagine aici · Ctrl+V</span></div>
      <canvas id="cv"></canvas>
      <div id="busy"><div class="spin"></div><div id="busyTxt">Număr…</div></div>
    </div>
    <input id="file" type="file" accept="image/*" hidden>
  </div>
  <aside>
    <div class="card">
      <div id="count">–</div>
      <div id="meta"></div>
    </div>
    <div class="card">
      <label>Ce să numere (opțional, în engleză: <i>bottle, person, coin…</i>)</label>
      <input id="text" type="text" placeholder="gol = automat (tipul dominant din poză)" autocomplete="off">
      <div style="height:10px"></div>
      <label>Exclude (opțional)</label>
      <input id="neg" type="text" placeholder="ex: cap" autocomplete="off">
      <div style="height:12px"></div>
      <div class="row">
        <button class="pri" id="go" disabled>Numără</button>
        <button id="pick">Altă poză</button>
      </div>
    </div>
    <div class="card">
      <label>Sensibilitate: <span id="thv">0.23</span></label>
      <input id="th" type="range" min="0.10" max="0.60" step="0.01" value="0.23">
      <div style="height:10px"></div>
      <div class="row">
        <button id="clr" disabled>Șterge exemple</button>
        <button id="save" disabled>Salvează PNG</button>
      </div>
      <div style="height:10px"></div>
      <div class="tog"><input type="checkbox" id="showBox"><label for="showBox" style="margin:0">Arată chenare</label></div>
      <div class="tog"><input type="checkbox" id="refine" checked><label for="refine" style="margin:0">A 2-a trecere (mai precis)</label></div>
    </div>
    <div class="card hint">
      <b>Cum:</b> pune poza și apasă <b>Numără</b>. Ca să-i arăți exact ce să numere, <b>trage un chenar</b> peste un obiect (galben). Apasă pe un punct ca să-l scoți / pui la loc.
    </div>
  </aside>
</main>
<script>
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d'),stage=$('stage');
const MAX=2400;
let img=null,blob=null,ex=[],res=null,off=new Set(),drag=null;

fetch('/api/health').then(r=>r.json()).then(j=>$('status').textContent='offline · '+j.device.toUpperCase()).catch(()=>{$('status').innerHTML='<span class="err">server oprit</span>'});

// ---------- încărcare imagine
stage.onclick=e=>{if(!img)$('file').click()};
$('pick').onclick=()=>$('file').click();
$('file').onchange=e=>e.target.files[0]&&load(e.target.files[0]);
stage.ondragover=e=>e.preventDefault();
stage.ondrop=e=>{e.preventDefault();const f=e.dataTransfer.files[0];f&&load(f)};
window.onpaste=e=>{const f=[...e.clipboardData.files][0];f&&load(f)};

async function load(file){
  const bmp=await createImageBitmap(file,{imageOrientation:'from-image'});
  const s=Math.min(1,MAX/Math.max(bmp.width,bmp.height));
  const c=document.createElement('canvas');c.width=Math.round(bmp.width*s);c.height=Math.round(bmp.height*s);
  c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
  blob=await new Promise(r=>c.toBlob(r,'image/jpeg',0.92));
  img=c;cv.width=c.width;cv.height=c.height;ex=[];res=null;off.clear();
  stage.classList.add('has');$('go').disabled=false;$('count').textContent='–';$('meta').textContent='';
  $('save').disabled=true;$('clr').disabled=true;draw();
  run();
}

// ---------- desen
function px(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]}
function boxes(){if(!res)return[];const t=+$('th').value;return res.boxes.map((b,i)=>({b,s:res.scores[i],i})).filter(o=>o.s>=t)}
function draw(){
  if(!img)return;ctx.drawImage(img,0,0);
  const W=cv.width,H=cv.height,lw=Math.max(2,W/500),rad=Math.max(5,W/180);
  const list=boxes();let n=0;
  for(const o of list){
    const[cx,cy,w,h]=o.b,on=!off.has(o.i);if(on)n++;
    if($('showBox').checked){ctx.strokeStyle=on?'#2ee6a6':'#ff5d5d88';ctx.lineWidth=lw;ctx.strokeRect((cx-w/2)*W,(cy-h/2)*H,w*W,h*H)}
    ctx.beginPath();ctx.arc(cx*W,cy*H,rad,0,7);ctx.fillStyle=on?'#2ee6a6':'#ff5d5d';ctx.fill();
    ctx.lineWidth=lw*0.8;ctx.strokeStyle='#000';ctx.stroke();
  }
  ctx.lineWidth=lw*1.5;ctx.strokeStyle='#ffb020';ctx.setLineDash([lw*4,lw*3]);
  for(const b of ex)ctx.strokeRect(b[0],b[1],b[2]-b[0],b[3]-b[1]);
  if(drag)ctx.strokeRect(drag[0],drag[1],drag[2]-drag[0],drag[3]-drag[1]);
  ctx.setLineDash([]);
  if(res)$('count').textContent=n;
}

// chenar exemplu (drag) / toggle punct (tap)
cv.onpointerdown=e=>{const[x,y]=px(e);drag=[x,y,x,y];cv.setPointerCapture(e.pointerId)};
cv.onpointermove=e=>{if(!drag)return;const[x,y]=px(e);drag[2]=x;drag[3]=y;draw()};
cv.onpointerup=e=>{
  if(!drag)return;const[x0,y0,x1,y1]=drag;drag=null;
  const b=[Math.min(x0,x1),Math.min(y0,y1),Math.max(x0,x1),Math.max(y0,y1)];
  if(b[2]-b[0]>8&&b[3]-b[1]>8){ex.push(b);$('clr').disabled=false;draw();return}
  // tap: cel mai apropiat punct
  const W=cv.width,H=cv.height,lim=Math.max(14,W/60);let best=-1,bd=1e9;
  for(const o of boxes()){const d=Math.hypot(o.b[0]*W-x0,o.b[1]*H-y0);if(d<bd){bd=d;best=o.i}}
  if(best>=0&&bd<lim){off.has(best)?off.delete(best):off.add(best)}
  draw();
};
$('clr').onclick=()=>{ex=[];$('clr').disabled=true;draw()};
$('th').oninput=()=>{$('thv').textContent=(+$('th').value).toFixed(2);draw()};
$('showBox').onchange=draw;

// ---------- numărare
$('go').onclick=run;
$('text').onkeydown=$('neg').onkeydown=e=>{if(e.key==='Enter')run()};
async function run(){
  if(!blob)return;
  $('busy').classList.add('on');$('busyTxt').textContent=ex.length?'Număr după exemplu…':'Număr…';$('go').disabled=true;
  const fd=new FormData();fd.append('image',blob,'img.jpg');fd.append('text',$('text').value);
  fd.append('neg_text',$('neg').value);fd.append('boxes',JSON.stringify(ex));fd.append('refine',$('refine').checked);
  try{
    const r=await fetch('/api/count',{method:'POST',body:fd});if(!r.ok)throw new Error(await r.text());
    res=await r.json();off.clear();
    $('meta').textContent=`${res.mode} · ${res.seconds}s · ${res.device}`;$('save').disabled=false;
  }catch(err){$('meta').innerHTML='<span class="err">Eroare: '+String(err.message).slice(0,120)+'</span>'}
  $('busy').classList.remove('on');$('go').disabled=false;draw();
}

// ---------- export
$('save').onclick=()=>{
  const c=document.createElement('canvas');c.width=cv.width;c.height=cv.height;const g=c.getContext('2d');
  g.drawImage(cv,0,0);const fs=Math.max(28,c.width/18);
  g.font=`700 ${fs}px system-ui`;const t='Total: '+$('count').textContent;const w=g.measureText(t).width;
  g.fillStyle='#000a';g.fillRect(0,0,w+fs,fs*1.6);g.fillStyle='#2ee6a6';g.fillText(t,fs/2,fs*1.15);
  const a=document.createElement('a');a.download='viccount_'+Date.now()+'.png';a.href=c.toDataURL('image/png');a.click();
};
</script>
</body>
</html>
